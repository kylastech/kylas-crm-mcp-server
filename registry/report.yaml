# registry/report.yaml
#
# Registry entries for the "report" bucket (Kylas reports, sd-report service).
#
# Same split as every other bucket file: this YAML says what the operation is
# and how an LLM should use it; app/reports.py owns the request schema
# (REPORT_CREATE_SCHEMA), the live config reference and the execution
# (create_report_logic). Unlike the entity buckets, the live reference comes
# from GET /v1/reports/config/{entityPlural} — the same call the Kylas web
# app's report builder makes — so build_payload needs an extra "entity"
# argument for these ids.
#
# report.create / report.preview: categories ONE_DIMENSIONAL and MULTI_DIMENSIONAL. Lookup-backed
# filters resolve through separate registry ids (team.lookup, campaign.lookup,
# campaign.activities, *.search_by_term, pipeline.details,
# meeting.lookup_related). Email receivedBy/user and GPS filters stay
# unsupported and are marked "NOT SUPPORTED" in the reference.

- id: report.create
  bucket: report
  intent: create
  method: POST
  path: /v3/reports
  dynamic_fields: true
  description: "Create and save a Kylas report (bar/pie chart or table, grouped by one to three fields, over a date range, with filters) on leads, deals, contacts, companies, tasks, meetings, calls, emails or quotations. build_payload needs entity=\"<entity>\"."
  usage_notes: >
    Call build_payload("report.create", entity="<entity>") FIRST — entity is
    required and is one of lead, deal, contact, company, task, meeting, call,
    email, quotation (the STANDARD type). tenant_fields_reference then lists,
    for that entity only: the dimensions you can group by, the metrics, the
    date fields and date operators, and every filter with its allowed
    operators and value format. Use ONLY ids listed there. Large picklist
    filters (country, timezone, companyIndustry, requirementCurrency,
    currency, ...) show an "options omitted" stub — re-call build_payload
    with fields=["<that filter>"] if the user mentioned one.

    The payload is SHORT and flat — the server validates it against the live
    config and builds the full Kylas report body itself (types, field input
    types, time-of-day, UTC conversion). Keys: entity, name (3-255 chars),
    description (optional), category (ONE_DIMENSIONAL default |
    MULTI_DIMENSIONAL), chart_type (bar | pie | table, default bar), group_by
    {field, format} (or a list for MULTI_DIMENSIONAL), metrics [{type,
    field}], date_range {field, operator, value?}, filters [{field, operator,
    value?}] (optional).

    name: ALWAYS give the report a proper, descriptive Title Case name that
    says what it shows — "<what is counted/summed> by <group-by> - <period>",
    plus the key filters — and ALWAYS end it with " (Made by MCP)". Examples:
    "Leads by Source - This Month (Made by MCP)", "Deal Value by Owner - Q3
    2026 (Made by MCP)", "Leads by Owner - India, Last 30 Days (Made by MCP)".
    If the user gave their own name, use it and still append " (Made by MCP)".
    Never use a vague name like "Report", "Test" or "New Report". Keep the
    whole name within 255 characters.

    group_by: ONE_DIMENSIONAL takes exactly one dimension. To group by two or
    three fields ("leads by owner AND source", "deals per month by owner")
    set category MULTI_DIMENSIONAL and pass group_by as a list of 1-3
    {field, format?} in grouping order, outer level first, no field twice —
    e.g. [{field: ownerId}, {field: source}]. MULTI_DIMENSIONAL allows only
    bar or table charts; metrics come from the FIRST dimension. A child field
    (pipelineStage, pipelineStageReason, activities) must come after its
    parent (pipeline, campaignActivities) when both are dimensions; then the
    parent filter is not required. Task reports allow only one
    associated-entity dimension. format is REQUIRED for every date dimension
    (YEARLY, QUARTERLY, MONTHLY, WEEKLY, DAILY; FINANCIAL_YEARLY /
    FINANCIAL_QUARTERLY only for INR tenants) and must be omitted otherwise.
    If a dimension lists "REQUIRES filter(s)", add those filters.

    metrics: COUNT id = number of records. With more than one metric the
    chart becomes a table (the server switches it and says so in "notes").

    date_range is required. If the user gave no period, use createdAt with
    current_month — the web app's default — and tell the user. For "between"
    give value [start, end] in the user's own local time (date or datetime);
    the server converts to UTC; the range may span at most 1825 days (about
    5 years), 90 days for email. last_n_days / next_n_days take value N
    (1-364). The date_range field cannot also be used as a filter.

    filters: lookup filters take ids — resolve each one through the registry
    id its reference line names in "resolve_via" (full list_tool ->
    build_payload -> execute_request cycle); never guess an id:
      users (owner, created by, ...)      -> user.lookup
      products                            -> product.lookup
      pipeline                            -> pipeline.lookup
      pipeline stage                      -> pipeline.details (Stage ID values
                                             of the pipeline in your pipeline
                                             filter, which must be equal/in)
      teams ("…Fields" filters)           -> team.lookup (server adds the
                                             "<user field> is_not_null" filter)
      campaign (campaignActivities)       -> campaign.lookup
      campaign activities (activities)    -> campaign.activities (campaign
                                             filter must be equal)
      linked leads/contacts/deals/companies -> lead/contact/deal/company
                                             .search_by_term (use the ID; task
                                             reports allow ONE of these)
      meeting participants / organizer    -> meeting.lookup_related with
                                             entity_type "invitee"; the value is
                                             the OBJECT {id, entity, name} (a
                                             list for in/not_in), not a bare id
    Email sentBy takes bare user id(s) from user.lookup (equal / in only).
    Filters marked "NOT SUPPORTED" (email receivedBy/user, GPS radius) can't
    be used.
    Picklist filters take an option from the reference (id, internal name or
    label are all accepted). is_null / is_not_null / is_empty / is_not_empty
    take no value; in / not_in take a list.

    On success data is {id, name, reportType, chartType, category, notes?}.
    Tell the user the report was created only when execute_request returned
    ok true.
  example:
    entity: lead
    name: "Leads by Source - This Month (Made by MCP)"
    chart_type: bar
    group_by: {field: source}
    metrics: [{type: COUNT, field: id}]
    date_range: {field: createdAt, operator: current_month}
    filters: [{field: country, operator: equal, value: IN}]

- id: report.preview
  bucket: report
  intent: preview
  method: POST
  path: /v3/reports/{entityPlural}
  dynamic_fields: true
  description: "Run a report and show its numbers WITHOUT saving it (same payload as report.create). build_payload needs entity=\"<entity>\"."
  usage_notes: >
    Same flow and the SAME short payload as report.create —
    build_payload("report.preview", entity="<entity>") returns the identical
    reference, and every report.create rule applies (group_by, metrics,
    date_range, filters, lookups). The only difference: name is optional and
    NOTHING is saved in Kylas.

    Use it when the user wants to SEE the numbers ("how many leads by source
    this month?", "show me deals by owner last quarter") or before saving a
    report they asked for, so they can check it. After a preview, ask the user
    whether to save it; if yes, call report.create with the same payload plus
    a proper name ending in " (Made by MCP)". Never claim a preview was saved.

    On success data is {saved: false, entity, chart_type, date_range,
    filters_applied, columns, rows, total_groups, totals, subtotals?, currency?,
    notes?, truncated?}. rows is a list of objects keyed by the column names:
    one column per group-by level (e.g. "Owner", "Source"), one per metric
    (e.g. "Number of Leads", "Sum of Budget") and, for ONE_DIMENSIONAL,
    "Share of total" for the first metric when it's a count or sum.
    MULTI_DIMENSIONAL results are flattened to one row per innermost group,
    with subtotals per first-level group. A group named "Not Available" means records with no
    value for that field. totals sums every COUNT/SUM metric. Present it as a
    markdown table with the totals, and mention the date range and filters.
  example:
    entity: lead
    chart_type: bar
    group_by: {field: source}
    metrics: [{type: COUNT, field: id}]
    date_range: {field: createdAt, operator: current_month}
