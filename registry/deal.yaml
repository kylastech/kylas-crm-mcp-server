# registry/deal.yaml
#
# Registry entries for the "deal" bucket — same approach as lead.yaml/contact.yaml.
#
# ARCHITECTURE — what lives here vs. what lives in main.py
# ---------------------------------------------------------------------------
# Each entry below is static operation metadata and LLM-facing guidance only:
# id, bucket, intent, method, path, dynamic_fields, description, usage_notes,
# example. There is deliberately no "schema:" block for the request/input
# shape — that would duplicate a schema that already exists elsewhere in this
# codebase, and a duplicate copy can silently drift from the real thing (see
# the search_page_offset bug found earlier in this project as a concrete
# example of exactly that failure mode).
#
# Instead, build_payload (main.py) resolves the real input schema at request
# time from the original, already-registered MCP tool schemas it snapshots
# into _ORIGINAL_TOOL_PARAMETERS, via the _real_get_schema / _real_search_schema
# / _real_search_by_term_schema / _real_idle_schema / _real_create_schema /
# _real_update_schema helpers — for deal specifically: get_deal's,
# search_entity's, search_entity_by_term's, search_idle_entities's,
# create_entity's, and update_entity's actual inputSchema, copied verbatim,
# never re-authored here. For entries where dynamic_fields is true,
# build_payload additionally fetches this tenant's live field metadata (via
# _fetch_deal_fields) and folds the real custom fields and picklist
# option id/label pairs into that schema before returning it — so the
# request shape a caller actually sees is always live, tenant-accurate data,
# not a static guess baked into this file.
#
# The sources of truth are intentionally kept separate, on purpose:
#   - YAML (this file)       -> what the operation is, how to route it, and
#                                how an LLM should use it (usage_notes/example).
#   - Runtime Python schemas -> the authoritative request/input shape
#                                (_ORIGINAL_TOOL_PARAMETERS / _real_*_schema).
#   - Live tenant metadata   -> this tenant's own custom fields and
#                                picklist/option values, fetched on demand.
#   - Python logic           -> validation, normalization, dispatch, and the
#                                actual Kylas API call (deal.create/update/
#                                get/search/search_by_term/search_idle's real
#                                *_logic functions in main.py, including
#                                create_deal_logic/update_deal_logic's own
#                                sequential-stage-advancement fallback when a
#                                pipeline has sequentialStageFlow=true).
# In short: YAML describes what the operation is and how the LLM should use
# it; runtime Python provides the authoritative request schema and execution
# behavior. Nothing here should ever try to re-describe the request shape —
# that description belongs to main.py alone, so there is exactly one place
# it can drift from reality, and it isn't this file.
#
# usage_notes below are VERBATIM/assembled from the real, currently-running
# old system's own text — get_deal's actual docstring, the generic
# search_entity/search_entity_by_term/search_idle_entities/create_entity/
# update_entity tools' own docstrings (the real registered tools that handle
# every deal operation — standalone search_deals is DEAD CODE, never
# decorated with @mcp.tool(), never actually registered), and
# DEAL_SYSTEM_INSTRUCTIONS' own sections (added alongside the old lead
# instructions). Nothing here is paraphrased or invented.
#
# NOTE: deal.get required adding "get_fn": get_deal_logic to
# _ENTITY_CONFIG["deal"] in main.py — it was missing entirely (only
# search_fn/by_term_fn/idle_fn were wired), the same class of gap meeting.get
# needed fixed earlier. get_deal_logic itself already existed and was
# already used by the real, registered get_deal tool; only the generic
# get_entity_logic dispatch path main.py's execute_request needs was absent.

- id: deal.get
  bucket: deal
  intent: get
  method: GET
  path: /deals/{deal_id}
  dynamic_fields: false
  description: "Get full details of a deal by ID (GET /deals/{id})."
  usage_notes: >
    Use when the user asks for complete deal info.
    deal_id: The deal ID (e.g. from search results).

    Diagnosis (verbatim from the old system's DIAGNOSIS_AND_REPORTING_INSTRUCTIONS,
    which applied this after showing ANY entity — deal, lead, or task):
    after showing this deal, append a diagnosis block in this exact format
    (skip severity levels with no signals; always include at least one 💡 line):
    "── Diagnosis ──────────────────────────────────────────
    🔴 <critical issue>
    🟡 <warning>
    🟢 <healthy signal>
    💡 Suggested: <next step>
    ───────────────────────────────────────────────────────"

    Deal signals: 🔴 closingDate is in the past → "Closing date passed X
    days ago — update or move to Closed Lost" (💡 "Reschedule closing date
    or mark as Closed Lost"). 🔴 no associatedContacts → "No contacts linked
    — can't track communication" (💡 "Link a contact to enable
    follow-ups"). 🟡 no activity for >14 days (from updatedAt or
    latestActivityCreatedAt) → "No activity in X days" (💡 "Schedule a
    follow-up call or meeting"). 🟡 products list empty → "No products
    attached" (💡 "Add products to complete the deal"). 🟡 value is 0 or
    null → "Deal value not set". 🟡 closingDate within 7 days but still in
    the first or second pipeline stage → "Closing soon but still in early
    stage" (💡 "Accelerate through pipeline stages"). 🟢 products attached →
    "X product(s) attached — total ₹Y". 🟢 closing date in the future →
    "Closing in X days".
  example: {deal_id: 12345}

- id: deal.search
  bucket: deal
  intent: search
  method: POST
  path: /search/deal
  dynamic_fields: true
  description: "Filter/search deals by field criteria."
  usage_notes: >
    filters: List of filter objects. Each must have: field (str) — Field
    internal/API name; operator (str) — one of that field's
    "allowed_operators" (from the live tenant_filterable_fields below);
    value — type depends on field type; timeZone (str,
    optional) — for date/datetime filters; type (str, optional) — field
    type, inferred from schema if omitted. Filters are REQUIRED (non-empty)
    for deal. page: 0-based (default 0). size: page size, max 100
    (default 20). sort: e.g. "createdAt,desc" (default).

    Only [FILTERABLE] fields (from the live tenant_filterable_fields below)
    are allowed. PICK_LIST exceptions (use internal name string, not Option
    ID): currency, country, dealSource.

    Date/datetime fields (filter/search): keep the value in the user's
    timezone; pass timeZone in the filter (or omit — server uses it). Do NOT
    convert filter values to UTC.

    Finding deals by product: call product.lookup(query) to resolve the
    product name to an ID, then filter {"field": "products", "operator":
    "equal", "value": <product_id>}.

    Never guess IDs — always resolve first: Users (createdBy, updatedBy,
    owner, ownedBy, etc.) — call user.lookup(query); if multiple matches,
    list them and ask user to pick. Products — call product.lookup(query);
    if multiple matches, list and ask.

    Pagination: always use the largest page size available. Do NOT
    auto-fetch all pages sequentially — fetch page 1, show results, then ask
    if the user wants more. If you receive a 429 error: stop, wait at least
    5 seconds, then retry once.

    Idle / Stagnant Deals: use deal.search_idle(days) for "no activity for N
    days" queries. Fallback: deal.search with updatedAt ≤ threshold AND
    latestActivityCreatedAt ≤ threshold.
  example:
    filters: [{field: "closingDate", operator: "greater_or_equal", value: "2024-01-01T00:00:00.000Z"}]

- id: deal.create
  bucket: deal
  intent: create
  method: POST
  path: /deals
  dynamic_fields: true
  description: "Create a new deal."
  usage_notes: >
    The payload argument you pass to execute_request IS the object below,
    sent exactly as-is — a flat JSON object with the field names directly as
    its top-level keys. Build this payload from user input only — no defaults, no extras. Keys:
    API name for standard fields, or field ID string for custom fields;
    custom fields go under "customFieldValues": {"<internalName>": <value>} —
    never use field ID as the key.

    Monetary fields (estimatedValue, actualValue, value): MUST be
    {"currencyId": <id>, "value": <number>} — never a plain number, the API
    rejects it. Example: "estimatedValue": {"currencyId": 431, "value": 32}.

    Owner (ownedBy): {"id": <user_id>} — resolve via user.lookup first.
    Example: "ownedBy": {"id": 7236}.

    Pipeline and stage: call pipeline.lookup(entity_type="DEAL") first.
    List pipelines and confirm with the user, even if only one exists. If
    the target pipeline has sequentialStageFlow=true (visible in
    pipeline.details output) and the requested stage isn't the first
    stage, the server automatically creates the deal in stage 1 first, then
    advances it stage-by-stage to the requested target — pass the desired
    target stage directly, the sequential advancement is handled
    transparently; you do not need to do anything differently.

    Products: ask the user for product name (resolve via product.lookup),
    quantity, price per unit, currency, and optional discount before
    adding — do NOT add products without confirming price, quantity, and
    currency first. Shape: {"products": [{"id": <product_id>, "quantity":
    <qty>, "price": {"currencyId": <id>, "value": <price>}, "discount":
    {"value": <disc>, "type": "PERCENTAGE|FLAT"}}]}.

    Picklist fields: use Option ID (number) from the live tenant_fields
    below, except currency, country, dealSource → use internal name
    (string).

    Date / datetime fields: call get_current_user to get the user's
    timezone, then call parse_datetime_to_utc_iso_tool(datetime_string,
    timezone) and put the returned UTC ISO string directly in the payload.

    Never guess IDs: ownedBy and any other user reference — call
    user.lookup(query) first; if multiple matches, list them and ask the
    user to pick.
  example:
    name: "Big Deal"
    closingDate: "2026-06-30T00:00:00.000Z"
    estimatedValue: {currencyId: 431, value: 50000}

- id: deal.search_by_term
  bucket: deal
  intent: search_by_term
  method: POST
  path: /search/deal
  dynamic_fields: false
  description: "Search/filter deals by a free-text search term."
  usage_notes: >
    Use this ONLY when the user provides a specific search term (e.g. a
    name or keyword). NEVER use this tool with wildcard characters ("*"),
    empty strings, or blank terms. NEVER use this tool when the user asks
    for "all" records — for "all"/"list" queries, use deal.search with a
    date filter (e.g. updatedAt >= last 90 days) instead.

    search_term: A specific term to search across multiple fields (name,
    etc.).

    page: 0-based (default 0). size: page size, max 100 (default 20). sort:
    e.g. "updatedAt,desc" (default).
  example: {search_term: "Acme"}

- id: deal.search_idle
  bucket: deal
  intent: search_idle
  method: POST
  path: /search/deal
  dynamic_fields: false
  description: "Search deals that have been idle (no recent activity) for N days."
  usage_notes: >
    Use this tool to find stale or neglected deals. Last-activity =
    max(updatedAt, latestActivityCreatedAt).

    days: Number of days of inactivity (e.g., 30 = last updated >30 days
    ago). time_zone: Timezone for date calculation (optional; defaults to
    current user's timezone or server default). page: 0-based (default 0).
    size: page size, max 100 (default 20). sort: e.g. "createdAt,desc"
    (default).

    Fallback if this doesn't cover what's needed: deal.search with
    updatedAt ≤ threshold AND latestActivityCreatedAt ≤ threshold.
  example: {days: 30}

- id: deal.update
  bucket: deal
  intent: update
  method: PUT
  path: /deals/{deal_id}
  dynamic_fields: true
  description: "Update an existing deal."
  usage_notes: >
    entity_id: pass the deal ID from search results (this bucket's real
    parameter name is "entity_id", not "deal_id" — inherited as-is from the
    old update_entity tool that actually handled this; deal.get's own real
    schema uses "deal_id" instead — that inconsistency is real, from the old
    system, not smoothed over here).

    Put entity_id and the fields you're changing together in one flat
    payload object.

    Fields are merged over the existing record — other fields are left
    unchanged, this is not a full replace.

    Move to a stage in the SAME pipeline: set the payload to
    {"entity_id": <id>, "pipelineStage": <stage_id>}. Move to a DIFFERENT
    pipeline: set the payload to {"entity_id": <id>, "pipeline": {...},
    "forecastingType": "..."} with the full pipeline object including the
    nested target stage. Closing reasons (Closed Lost/Unqualified): call
    pipeline.details for the valid reasons, ask the user to pick, then
    pass {"entity_id": <id>, "pipelineStage": stage_id, "pipelineStageReason":
    reason}. If the pipeline has sequentialStageFlow=true, the same automatic
    first-stage fallback described in deal.create applies here too.

    Adding contacts/products: set the payload to {"entity_id": <id>,
    "associatedContacts": [{"id": 4942095, "name": "Alice"}], "products":
    [{"id": 245208, "quantity": 2}]} — existing products/contacts are
    preserved, new ones are merged (duplicates by ID skipped).

    All the same rules as deal.create apply to any other field being
    changed here (monetary field wrapping, picklist Option ID exceptions,
    customFieldValues internal-name rule, date/datetime UTC conversion,
    never guessing ownedBy) — see deal.create's usage_notes for the full
    rules; not repeated verbatim here to avoid duplicating the same text
    twice.
  example: {entity_id: 12345, pipelineStage: 67890}
