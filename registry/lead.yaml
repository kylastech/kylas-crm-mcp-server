# registry/lead.yaml
#
# Registry entries for the "lead" bucket — 3-tool architecture POC.
#
# usage_notes below are VERBATIM/assembled from the real, currently-running
# old system's own text — get_lead's actual docstring, search_entity's,
# search_entity_by_term's, search_idle_entities's, create_entity's, and
# update_entity's actual docstrings (the real registered tools that handled
# every lead operation, since standalone search_leads/create_lead/
# update_lead tools are dead code, never registered), and
# SYSTEM_INSTRUCTIONS' COMMON RULES + "Lead Operations" sections. Nothing
# here is paraphrased or invented; where the old system genuinely had
# nothing to say (see lead.get), that's left short rather than padded.
#
# NOTE on "schema": there is deliberately no schema: block per entry anymore.
# build_payload now copies the REAL schema straight from the actual old
# tools (get_lead/search_entity/search_entity_by_term/search_idle_entities/
# create_entity/update_entity) at call time — see _real_*_schema in main.py.
# A schema: block here would be dead, unread config exactly like the
# search_page_offset bug found earlier in this project — better to have
# none than a copy that can silently drift from the real thing.

- id: lead.get
  bucket: lead
  intent: get
  method: GET
  path: /leads/{lead_id}
  dynamic_fields: false
  description: "Get full details of a lead by ID (GET /leads/{id})."
  usage_notes: >
    Use when the user asks for complete lead info, lead details, or to view a
    specific lead.
    lead_id: The lead ID (e.g. from search_leads or search_leads_by_term results).
  example: {lead_id: 12345}

- id: lead.search
  bucket: lead
  intent: search
  method: POST
  path: /search/lead
  dynamic_fields: true
  description: "Filter/search leads by field criteria."
  usage_notes: >
    filters: List of filter objects. Each must have: field (str) — Field
    internal/API name (e.g. firstName, country, source, createdAt); operator
    (str) — one of the allowed operators for that field type; value — type
    depends on field type; timeZone (str, optional) — for date/datetime
    filters; type (str, optional) — field type, inferred from schema if
    omitted. Filters are REQUIRED (non-empty) for lead. page: 0-based
    (default 0). size: page size, max 100 (default 20). sort: e.g.
    "createdAt,desc" (default).

    Only [FILTERABLE] fields (from the live tenant_filterable_fields below)
    are allowed. PICK_LIST/MULTI_PICKLIST: use Option ID, except
    requirementCurrency, companyBusinessType, country, timezone,
    companyIndustry → use internal name.

    Date/datetime fields (filter/search): keep the value in the user's
    timezone; pass timeZone in the filter (or omit — server uses it). Do NOT
    convert filter values to UTC.

    Never guess IDs — always resolve first: Users (createdBy, updatedBy,
    owner, ownerId, assignedTo, etc.) — call lookup_users(query); never use
    contact or lead lookup tools for employees/users; if multiple matches,
    list them and ask user to pick. Products — call lookup_products(query);
    if multiple matches, list and ask. Entity IDs (for association filters) —
    search for the entity first to get its real ID; never invent IDs.

    Pagination: always use the largest page size available. Do NOT
    auto-fetch all pages sequentially — fetch page 1, show results, then ask
    if the user wants more. If you receive a 429 error: stop, wait at least
    5 seconds, then retry once.

    Idle / Stagnant Leads: use search_idle_entities("lead", days) for "no
    activity for N days" queries. Fallback: search_entity("lead", [...])
    with updatedAt ≤ threshold AND latestActivityCreatedAt ≤ threshold.
  example:
    filters: [{field: "updatedAt", operator: "greater_or_equal", value: "2024-01-01T00:00:00.000Z"}]

- id: lead.create
  bucket: lead
  intent: create
  method: POST
  path: /leads
  dynamic_fields: true
  description: "Create a new lead."
  usage_notes: >
    Build field_values from user input only — no defaults, no extras. Keys:
    API name for standard fields, or field ID string for custom fields;
    custom fields go under "customFieldValues": {"<internalName>": <value>} —
    never use field ID as the key.

    Phone: Shorthand "phone": "9876543210" + "phone_country_code": "IN"
    (2-letter code or dial prefix e.g. "+91"). Full array: "phoneNumbers":
    [{"value": "9876543210", "code": "IN", "type": "MOBILE", "primary":
    true}] — still include "phone_country_code" at top level even with full
    array. REQUIRED: if the user gave a phone number but NO country/dial
    code, do NOT call this tool — ask them first. REQUIRED: if the user gave
    a phone number but NO phone type, do NOT call this tool — ask them
    first: "Is this number MOBILE, WORK, HOME, or PERSONAL?" Include
    "phone_type": "<TYPE>" at top level alongside "phone_country_code".
    Phone types: MOBILE, WORK, HOME, PERSONAL. First entry is primary by
    default.

    Email: Shorthand "email": "user@example.com" (becomes OFFICE, primary).
    Full array: "emails": [{"value": "user@example.com", "type": "OFFICE",
    "primary": true}]. Email types: OFFICE, PERSONAL. Exactly one must be
    primary.

    Picklist fields: use Option ID (number) from the live tenant_fields
    below, except requirementCurrency, companyBusinessType, country,
    timezone, companyIndustry → use internal name (string).

    Date / datetime fields: call get_current_user to get the user's
    timezone, then call parse_datetime_to_utc_iso_tool(datetime_string,
    timezone) and use the returned UTC ISO string in field_values.

    Never guess IDs: ownerId and any other user reference (createdBy,
    updatedBy, assignedTo, etc.) — call lookup_users(query) first; never use
    contact or lead lookup tools for employees/users; if multiple matches,
    list them and ask the user to pick.

    Example field_values shape: {"firstName": "Jane", "lastName": "Doe",
    "email": "jane@example.com", "phone": "9876543210",
    "phone_country_code": "IN", "customFieldValues": {"cfLeadSource":
    "Web"}, "leadSource": <picklist_option_id>}
  example: {firstName: "Jane", lastName: "Doe", email: "jane@x.com"}

- id: lead.search_by_term
  bucket: lead
  intent: search_by_term
  method: POST
  path: /search/lead
  dynamic_fields: false
  description: "Search/filter leads by a free-text search term."
  usage_notes: >
    Use this ONLY when the user provides a specific search term (e.g. a
    name, email, or keyword). NEVER use this tool with wildcard characters
    ("*"), empty strings, or blank terms. NEVER use this tool when the user
    asks for "all" records (e.g. "show all leads") — for "all"/"list"
    queries, use lead.search with a date filter (e.g. updatedAt >= last 90
    days) instead.

    search_term: A specific term to search across multiple fields (first
    name, last name, email, phone, etc.).

    page: 0-based (default 0). size: page size, max 100 (default 20). sort:
    e.g. "updatedAt,desc" (default).
  example: {search_term: "John"}

- id: lead.search_idle
  bucket: lead
  intent: search_idle
  method: POST
  path: /search/lead
  dynamic_fields: false
  description: "Search leads that have been idle (no recent activity) for N days."
  usage_notes: >
    Use this tool to find stale or neglected leads.

    days: Number of days of inactivity (e.g., 30 = last updated >30 days
    ago). time_zone: Timezone for date calculation (optional; defaults to
    current user's timezone or server default). page: 0-based (default 0).
    size: page size, max 100 (default 20). sort: e.g. "createdAt,desc"
    (default).

    Fallback if this doesn't cover what's needed: lead.search with
    updatedAt ≤ threshold AND latestActivityCreatedAt ≤ threshold.
  example: {days: 30}

- id: lead.update
  bucket: lead
  intent: update
  method: PUT
  path: /leads/{lead_id}
  dynamic_fields: true
  description: "Update an existing lead."
  usage_notes: >
    entity_id: pass the lead ID from search results (this bucket's real
    parameter name is "entity_id", not "lead_id" — inherited as-is from the
    old update_entity tool that actually handled this; lead.get's own real
    schema uses "lead_id" instead — that inconsistency is real, from the old
    system, not smoothed over here).

    Fields are merged over the existing record — other fields are left
    unchanged, this is not a full replace. Example: field_values =
    {"firstName": "Jane", "lastName": "Doe"}.

    Phone updates: always include phone_country_code (e.g. "IN", "+91",
    "US") whenever phone or phoneNumbers is in field_values. Never assume a
    default country.

    All the same rules as lead.create apply to any field being changed here
    (email/phone shorthand, picklist Option ID exceptions, customFieldValues
    internal-name rule, date/datetime UTC conversion, never guessing
    ownerId) — see lead.create's usage_notes for the full rules; not
    repeated verbatim here to avoid duplicating the same text twice.
  example: {entity_id: 12345, firstName: "Jane", lastName: "Doe"}
