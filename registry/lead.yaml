# registry/lead.yaml
#
# Registry entries for the "lead" bucket — 3-tool architecture POC.
#
# ARCHITECTURE — what lives here vs. what lives in main.py
# ---------------------------------------------------------------------------
# Each entry below is static operation metadata and LLM-facing guidance only:
# id, bucket, intent, method, path, dynamic_fields, description, usage_notes,
# example. There is deliberately no "schema:" block for the request/input
# shape — that would duplicate a schema that already exists elsewhere in this
# codebase, and a duplicate copy can silently drift from the real thing (see
# the search_page_offset bug found earlier in this project as a concrete
# example of exactly that failure mode).
#
# Instead, build_payload (main.py) resolves the real input schema at request
# time from the original, already-registered MCP tool schemas it snapshots
# into _ORIGINAL_TOOL_PARAMETERS, via the _real_get_schema / _real_search_schema
# / _real_search_by_term_schema / _real_idle_schema / _real_create_schema /
# _real_update_schema helpers — for lead specifically: get_lead's,
# search_entity's, search_entity_by_term's, search_idle_entities's,
# create_entity's, and update_entity's actual inputSchema, copied verbatim,
# never re-authored here. For entries where dynamic_fields is true,
# build_payload additionally fetches this tenant's live field metadata (via
# _fetch_lead_fields) and folds the real custom fields and picklist
# option id/label pairs into that schema before returning it — so the
# request shape a caller actually sees is always live, tenant-accurate data,
# not a static guess baked into this file.
#
# The sources of truth are intentionally kept separate, on purpose:
#   - YAML (this file)       -> what the operation is, how to route it, and
#                                how an LLM should use it (usage_notes/example).
#   - Runtime Python schemas -> the authoritative request/input shape
#                                (_ORIGINAL_TOOL_PARAMETERS / _real_*_schema).
#   - Live tenant metadata   -> this tenant's own custom fields and
#                                picklist/option values, fetched on demand.
#   - Python logic           -> validation, normalization, dispatch, and the
#                                actual Kylas API call (lead.create/update/
#                                get/search/search_by_term/search_idle's real
#                                *_logic functions in main.py).
# In short: YAML describes what the operation is and how the LLM should use
# it; runtime Python provides the authoritative request schema and execution
# behavior. Nothing here should ever try to re-describe the request shape —
# that description belongs to main.py alone, so there is exactly one place
# it can drift from reality, and it isn't this file.
#
# usage_notes below are VERBATIM/assembled from the real, currently-running
# old system's own text — get_lead's actual docstring, search_entity's,
# search_entity_by_term's, search_idle_entities's, create_entity's, and
# update_entity's actual docstrings (the real registered tools that handled
# every lead operation, since standalone search_leads/create_lead/
# update_lead tools are dead code, never registered), and
# SYSTEM_INSTRUCTIONS' COMMON RULES + "Lead Operations" sections. Nothing
# here is paraphrased or invented; where the old system genuinely had
# nothing to say (see lead.get), that's left short rather than padded.

- id: lead.get
  bucket: lead
  intent: get
  method: GET
  path: /leads/{lead_id}
  dynamic_fields: false
  description: "Get full details of a lead by ID (GET /leads/{id})."
  usage_notes: >
    Use when the user asks for complete lead info, lead details, or to view a
    specific lead.
    lead_id: The lead ID (e.g. from search_leads or search_leads_by_term results).

    Diagnosis (verbatim from the old system's DIAGNOSIS_AND_REPORTING_INSTRUCTIONS,
    which applied this after showing ANY entity — deal, lead, or task):
    after showing this lead, append a diagnosis block in this exact format
    (skip severity levels with no signals; always include at least one 💡 line):
    "── Diagnosis ──────────────────────────────────────────
    🔴 <critical issue>
    🟡 <warning>
    🟢 <healthy signal>
    💡 Suggested: <next step>
    ───────────────────────────────────────────────────────"

    Lead signals: 🔴 no activity for >30 days → "Stagnant for X days — at
    risk of going cold" (💡 "Follow up immediately or reassign to another
    owner"). 🟡 no associated contact or company → "No contact or company
    linked" (💡 "Create or link a contact for this lead"). 🟡 no products →
    "No products associated". 🟡 no owner assigned → "Unassigned — no owner
    set" (💡 "Assign to a sales rep"). 🟢 active within 7 days → "Recently
    active".
  example: {lead_id: 12345}

- id: lead.search
  bucket: lead
  intent: search
  method: POST
  path: /search/lead
  dynamic_fields: true
  description: "Filter/search leads by field criteria."
  usage_notes: >
    filters: List of filter objects. Each must have: field (str) — Field
    internal/API name (e.g. firstName, country, source, createdAt); operator
    (str) — one of the allowed operators for that field type; value — type
    depends on field type; timeZone (str, optional) — for date/datetime
    filters; type (str, optional) — field type, inferred from schema if
    omitted. Filters are REQUIRED (non-empty) for lead. page: 0-based
    (default 0). size: page size, max 100 (default 20). sort: e.g.
    "createdAt,desc" (default).

    Only [FILTERABLE] fields (from the live tenant_filterable_fields below)
    are allowed. PICK_LIST/MULTI_PICKLIST: use Option ID, except
    requirementCurrency, companyBusinessType, country, timezone,
    companyIndustry → use internal name.

    Date/datetime fields (filter/search): REQUIRED — resolve id
    "user.current" (build_payload -> execute_request) first to get the real
    timezone (never assume UTC, never guess). Keep the filter's value in
    that local timezone; pass it as the filter's own "timeZone" property (or
    omit it — execute_request falls back to a default, but passing the real
    one is safer and required if you don't already know it from earlier this
    session). Do NOT convert filter values to UTC yourself, and do NOT put a
    trailing "Z" on them — that is for *.create/*.update payloads only (see
    below), never for search filter values.

    Never guess IDs — always resolve first: Users (createdBy, updatedBy,
    owner, ownerId, assignedTo, etc.) — REQUIRED: resolve id "user.lookup"
    (build_payload -> execute_request); never use contact or lead lookup
    tools for employees/users; if multiple matches, list them and ask user
    to pick. Products — REQUIRED: resolve id "product.lookup" (build_payload
    -> execute_request); if multiple matches, list and ask. Entity IDs (for
    association filters) — search for the entity first to get its real ID;
    never invent IDs.

    Pagination: always use the largest page size available. Do NOT
    auto-fetch all pages sequentially — fetch page 1, show results, then ask
    if the user wants more. If you receive a 429 error: stop, wait at least
    5 seconds, then retry once.

    Idle / Stagnant Leads: use id "lead.search_idle" (build_payload ->
    execute_request) for "no activity for N days" queries. Fallback: id
    "lead.search" (build_payload -> execute_request) with updatedAt ≤
    threshold AND latestActivityCreatedAt ≤ threshold.
  example:
    filters: [{field: "updatedAt", operator: "greater_or_equal", value: "2024-01-01T00:00:00.000", timeZone: "Asia/Calcutta"}]

- id: lead.create
  bucket: lead
  intent: create
  method: POST
  path: /leads
  dynamic_fields: true
  description: "Create a new lead."
  usage_notes: >
    The payload argument you pass to execute_request IS the object below,
    sent exactly as-is — a flat JSON object with the field names directly as
    its top-level keys. Build this payload from user input only — no defaults, no extras. Keys:
    API name for standard fields, or field ID string for custom fields;
    custom fields go under "customFieldValues": {"<internalName>": <value>} —
    never use field ID as the key.

    Phone: Shorthand "phone": "9876543210" + "phone_country_code": "IN"
    (2-letter code or dial prefix e.g. "+91"). Full array: "phoneNumbers":
    [{"value": "9876543210", "code": "IN", "type": "MOBILE", "primary":
    true}] — still include "phone_country_code" at top level even with full
    array. REQUIRED: if the user gave a phone number but NO country/dial
    code, do NOT call this tool — ask them first. REQUIRED: if the user gave
    a phone number but NO phone type, do NOT call this tool — ask them
    first: "Is this number MOBILE, WORK, HOME, or PERSONAL?" Include
    "phone_type": "<TYPE>" at top level alongside "phone_country_code".
    Phone types: MOBILE, WORK, HOME, PERSONAL. First entry is primary by
    default.

    Email: Shorthand "email": "user@example.com" (becomes OFFICE, primary).
    Full array: "emails": [{"value": "user@example.com", "type": "OFFICE",
    "primary": true}]. Email types: OFFICE, PERSONAL. Exactly one must be
    primary.

    Picklist fields: use Option ID (number) from the live tenant_fields
    below, except requirementCurrency, companyBusinessType, country,
    timezone, companyIndustry → use internal name (string).

    Date / datetime fields: REQUIRED: resolve id "user.current" first to get
    the user's timezone, then id "datetime.parse" (build_payload ->
    execute_request; payload: local_datetime, timezone) and put the
    returned UTC ISO string directly in the payload.

    Never guess IDs: ownerId and any other user reference (createdBy,
    updatedBy, assignedTo, etc.) — REQUIRED: resolve id "user.lookup"
    (build_payload -> execute_request) first; never use contact or lead
    lookup tools for employees/users; if multiple matches, list them and ask
    the user to pick.

    This payload's exact shape, flat, no wrapper key: {"firstName": "Jane",
    "lastName": "Doe", "email": "jane@example.com", "phone": "9876543210",
    "phone_country_code": "IN", "customFieldValues": {"cfLeadSource":
    "Web"}, "leadSource": <picklist_option_id>}
  example: {firstName: "Jane", lastName: "Doe", email: "jane@x.com"}

- id: lead.search_by_term
  bucket: lead
  intent: search_by_term
  method: POST
  path: /search/lead
  dynamic_fields: false
  description: "Search/filter leads by a free-text search term."
  usage_notes: >
    Use this ONLY when the user provides a specific search term (e.g. a
    name, email, or keyword). NEVER use this tool with wildcard characters
    ("*"), empty strings, or blank terms. NEVER use this tool when the user
    asks for "all" records (e.g. "show all leads") — for "all"/"list"
    queries, use lead.search with a date filter (e.g. updatedAt >= last 90
    days) instead.

    search_term: A specific term to search across multiple fields (first
    name, last name, email, phone, etc.).

    page: 0-based (default 0). size: page size, max 100 (default 20). sort:
    e.g. "updatedAt,desc" (default).
  example: {search_term: "John"}

- id: lead.search_idle
  bucket: lead
  intent: search_idle
  method: POST
  path: /search/lead
  dynamic_fields: false
  description: "Search leads that have been idle (no recent activity) for N days."
  usage_notes: >
    Use this tool to find stale or neglected leads.

    days: Number of days of inactivity (e.g., 30 = last updated >30 days
    ago). time_zone: Timezone for date calculation (optional; defaults to
    current user's timezone or server default). page: 0-based (default 0).
    size: page size, max 100 (default 20). sort: e.g. "createdAt,desc"
    (default).

    Fallback if this doesn't cover what's needed: lead.search with
    updatedAt ≤ threshold AND latestActivityCreatedAt ≤ threshold.
  example: {days: 30}

- id: lead.update
  bucket: lead
  intent: update
  method: PUT
  path: /leads/{lead_id}
  dynamic_fields: true
  description: "Update an existing lead."
  usage_notes: >
    entity_id: pass the lead ID from search results (this bucket's real
    parameter name is "entity_id", not "lead_id" — inherited as-is from the
    old update_entity tool that actually handled this; lead.get's own real
    schema uses "lead_id" instead — that inconsistency is real, from the old
    system, not smoothed over here).

    Put entity_id and the fields you're changing together in one flat
    payload object: {"entity_id": 12345, "firstName": "Jane", "lastName":
    "Doe"}.

    Fields are merged over the existing record — other fields are left
    unchanged, this is not a full replace.

    Phone updates: always include phone_country_code (e.g. "IN", "+91",
    "US") whenever phone or phoneNumbers is in the payload. Never assume a
    default country.

    All the same rules as lead.create apply to any field being changed here
    (email/phone shorthand, picklist Option ID exceptions, customFieldValues
    internal-name rule, date/datetime UTC conversion, never guessing
    ownerId) — see lead.create's usage_notes for the full rules; not
    repeated verbatim here to avoid duplicating the same text twice.
  example: {entity_id: 12345, firstName: "Jane", lastName: "Doe"}
