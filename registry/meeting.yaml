# registry/meeting.yaml
#
# Registry entries for the "meeting" bucket — same approach as lead.yaml/contact.yaml.
#
# ARCHITECTURE — what lives here vs. what lives in main.py
# ---------------------------------------------------------------------------
# Each entry below is static operation metadata and LLM-facing guidance only:
# id, bucket, intent, method, path, dynamic_fields, description, usage_notes,
# example. There is deliberately no "schema:" block for the request/input
# shape — that would duplicate a schema that already exists elsewhere in this
# codebase, and a duplicate copy can silently drift from the real thing (see
# the search_page_offset bug found earlier in this project as a concrete
# example of exactly that failure mode).
#
# Instead, build_payload (main.py) resolves the real input schema at request
# time from the original, already-registered MCP tool schemas it snapshots
# into _ORIGINAL_TOOL_PARAMETERS, via the _real_get_schema / _real_search_schema
# / _real_search_by_term_schema / _real_create_schema / _real_update_schema
# helpers — for meeting specifically: get_meeting's, search_entity's,
# search_entity_by_term's, create_entity's, and update_entity's actual
# inputSchema, copied verbatim, never re-authored here. For entries where
# dynamic_fields is true, build_payload additionally fetches this tenant's
# live field metadata (via _fetch_meeting_fields) and folds the real custom
# fields and picklist option id/label pairs into that schema before
# returning it — so the request shape a caller actually sees is always live,
# tenant-accurate data, not a static guess baked into this file. Note that
# this live fold does not add the synthetic search fields (associatedLeads/
# associatedContacts/associatedDeals/associatedCompanies/participants) that
# meeting.search's usage_notes describe below — those exist in
# _MEETING_SEARCH_SYNTHETIC_FILTERABLE in main.py, not in tenant field
# metadata, so usage_notes is the only place documenting them; that's a real
# gap in the runtime-schema story, not something this file smooths over.
#
# The sources of truth are intentionally kept separate, on purpose:
#   - YAML (this file)       -> what the operation is, how to route it, and
#                                how an LLM should use it (usage_notes/example).
#   - Runtime Python schemas -> the authoritative request/input shape
#                                (_ORIGINAL_TOOL_PARAMETERS / _real_*_schema).
#   - Live tenant metadata   -> this tenant's own custom fields and
#                                picklist/option values, fetched on demand.
#   - Python logic           -> validation, normalization, dispatch, and the
#                                actual Kylas API call (meeting.create/update/
#                                get/search/search_by_term's real *_logic
#                                functions in main.py).
# In short: YAML describes what the operation is and how the LLM should use
# it; runtime Python provides the authoritative request schema and execution
# behavior. Nothing here should ever try to re-describe the request shape —
# that description belongs to main.py alone, so there is exactly one place
# it can drift from reality, and it isn't this file.
#
# usage_notes below are VERBATIM/assembled from the real, currently-running
# old system's own text — get_meeting's actual docstring, the generic
# search_entity/search_entity_by_term/create_entity/update_entity tools'
# own docstrings (the real registered tools that handle every meeting
# operation — standalone search_meetings is DEAD CODE, never decorated with
# @mcp.tool(), never actually registered), and MEETING_SYSTEM_INSTRUCTIONS'
# own sections. Nothing here is paraphrased or invented.
#
# Deliberately has NO meeting.search_idle entry: the old system's real
# _ENTITY_CONFIG["meeting"]["idle_fn"] is None (confirmed directly in
# main.py) — meetings never had idle-search support at all. Not an
# omission; adding one would be inventing a capability that never existed.
#
# Unlike lead/contact, meeting.search's filters are OPTIONAL (empty rules =
# all records, confirmed via _ENTITY_CONFIG entity_type not in ("meeting",
# "call_log") check in search_entity_logic) — called out explicitly below
# rather than smoothed into the same wording lead/contact use.

- id: meeting.get
  bucket: meeting
  intent: get
  method: GET
  path: /meetings/{meeting_id}
  dynamic_fields: false
  description: "Get full details of a meeting by ID (GET /meetings/{id})."
  # The real old get_meeting tool's docstring was exactly this one line plus
  # the param note below — nothing more, same short shape as lead.get.
  usage_notes: >
    meeting_id: The meeting ID.
  example: {meeting_id: 111}

- id: meeting.search
  bucket: meeting
  intent: search
  method: POST
  path: /meetings/search
  dynamic_fields: true
  description: "Filter/search meetings by field criteria."
  usage_notes: >
    filters: List of filter objects. Each must have: field (str) — e.g. title,
    status, from, owner, associatedLeads, participants; operator (str) — e.g.
    equal, contains, in; value — for status use internal name, for
    associated* equal use numeric id, for participants use a list containing
    the FULL participant object from meeting.lookup_related;
    timeZone (str, optional) — for date/datetime filters.

    Unlike lead/contact/task/deal/company, filters are OPTIONAL for meeting —
    an empty filter list returns all meetings, it does not error.

    page: 0-based (default 0). size: page size, max 500 (default 20). sort:
    e.g. "from,desc" (default). Do NOT sort by "scheduledAt" or "updatedAt" —
    the meetings API only supports a limited set of sortable fields (from,
    createdAt); those two get silently normalized to "from" internally, but
    don't rely on that — pass "from,desc" or "createdAt,desc" directly.

    Only [FILTERABLE] fields (from the live tenant_filterable_fields below)
    are allowed, plus these synthetic fields the search endpoint accepts even
    though field metadata omits them: associatedLeads, associatedContacts,
    associatedDeals, associatedCompanies (type long; equal / is_null /
    is_not_null) and participants (type participants_lookup; in / not_in
    only). Status filter values use internal name — "scheduled", "conducted",
    "missed", "cancelled". Use "from" (start datetime), "to" (end datetime),
    or "conductedAt" (conducted datetime) for date/time filtering — do NOT
    use "scheduledAt", it does not exist as a real field (silently mapped to
    "from" internally, but don't rely on that).

    Never guess IDs — always resolve first: call
    meeting.lookup_related(entity_type, query) before filtering by
    associatedLeads/associatedContacts/associatedDeals/associatedCompanies
    (entity_type: "lead", "contact", "deal", or "company" — use the returned
    numeric id) or by participants (entity_type="invitee" — use the FULL
    returned object, e.g. {"id": 123, "entity": "lead", "name": "...",
    "emails": [...]}, not just the id). For owner: resolve the user via
    user.lookup(query) first, then filter {"field": "owner", "operator":
    "equal", "value": <user_id>}. For organizer: resolve via
    meeting.lookup_related(entity_type="invitee", query) first, then
    filter {"field": "organizer", "operator": "equal", "value": <user_id>}.
    Never use meeting.search_by_term to search meetings by owner or organizer
    name — it only searches the title field.

    Pagination: always use the largest page size available. Do NOT
    auto-fetch all pages sequentially — fetch page 1, show results, then ask
    if the user wants more. If you receive a 429 error: stop, wait at least
    5 seconds, then retry once.
  example:
    filters: [{field: "status", operator: "equal", value: "scheduled"}]

- id: meeting.create
  bucket: meeting
  intent: create
  method: POST
  path: /meetings
  dynamic_fields: true
  description: "Create a new meeting."
  usage_notes: >
    Required: title, from, to (UTC ISO datetime strings), and participants
    (at least one user, e.g. [{"id": <user_id>, "entity": "user"}]).

    Before creating, ask the user for: title (required); start/end datetime
    (required — convert to UTC via get_current_user +
    parse_datetime_to_utc_iso_tool); participants (required — resolve via
    meeting.lookup_related with entity_type="invitee", pick the row
    with the correct entity type); related entities (optional — resolve IDs
    first via the same lookup id); location and allDay (optional).

    CRITICAL RULES FOR INVITEES: only leads/contacts with a VALID EMAIL can
    be added as invitees (check the emails array from the lookup result).
    Deals CANNOT be added as invitees — if the user asks to add a deal as an
    invitee, do NOT include it in participants and inform them of this
    restriction; the server also strips any participant with
    "entity": "deal" and rejects the create entirely if none remain.

    Payload shape:
    {"title": "...", "from": "<UTC ISO>", "to": "<UTC ISO>", "allDay": false,
    "timezone": {"id": <tz_picklist_id>, "name": "Asia/Calcutta"},
    "participants": [{"id": <user_id>, "entity": "user|lead|contact|external"}],
    "relatedTo": [{"id": <entity_id>, "entity": "lead|contact|deal|company"}],
    "location": "Office", "description": "..."}

    Resolving entity IDs — never guess: Meeting owner/conductor (CRM
    users/sales reps) — always user.lookup, never lookup contacts/leads/
    companies for sales reps. Participants/organizer — meeting.lookup_related
    with entity_type="invitee" (organizer is usually the row with
    entity="user"). relatedTo leads/contacts/deals/companies — same id with
    entity_type="lead"/"contact"/"deal"/"company" respectively.

    timezone: use the timezone picklist ID from the live tenant_fields below,
    not a bare string. customFieldValues: {"<internalName>": <value>} — never
    use field ID as the key. Picklist fields: use Option ID (number) from the
    live tenant_fields below.
  example:
    title: "Demo Call"
    from: "2026-05-10T08:00:00.000Z"
    to: "2026-05-10T08:30:00.000Z"
    participants: [{id: 7236, entity: "user"}]

- id: meeting.search_by_term
  bucket: meeting
  intent: search_by_term
  method: POST
  path: /meetings/search
  dynamic_fields: false
  description: "Search/filter meetings by a free-text search term (title only)."
  usage_notes: >
    Meetings do not support multi-field free-text search — this searches the
    "title" field ONLY (contains match). Do NOT use this to find meetings by
    owner or organizer name; look up their user ID via user.lookup or
    meeting.lookup_related(entity_type="invitee") instead, then use
    meeting.search with an "owner" or "organizer" filter.

    Use this ONLY when the user provides a specific search term. NEVER use
    this tool with wildcard characters ("*"), empty strings, or blank terms.
    NEVER use this tool when the user asks for "all" meetings — for
    "all"/"list" queries, use meeting.search with an empty or date-range
    filter instead.

    search_term: A specific term to match against the meeting title.

    page: 0-based (default 0). size: page size, max 500 (default 20). sort:
    e.g. "from,desc" (default) — do NOT sort by "scheduledAt" or "updatedAt".
  example: {search_term: "Demo Call"}

- id: meeting.update
  bucket: meeting
  intent: update
  method: PUT
  path: /meetings/{meeting_id}
  dynamic_fields: true
  description: "Update an existing meeting."
  usage_notes: >
    entity_id: pass the meeting ID from search results (this bucket's real
    parameter name is "entity_id", not "meeting_id" — inherited as-is from
    the old update_entity tool that actually handled this; meeting.get's own
    real schema uses "meeting_id" instead — that inconsistency is real, from
    the old system, not smoothed over here).

    Put entity_id and the fields you're changing together in one flat
    payload object. The server GETs the existing meeting first, then
    merges this payload into it before saving — other fields are left
    unchanged, this is not a full replace. "participants" and "relatedTo"
    are merged (deduplicated by id+entity) rather than replaced outright;
    "customFieldValues" is merged key-by-key. Example: {"entity_id": 111,
    "participants": [{"id": <user_id>, "entity": "user"}]} adds a
    participant without dropping existing ones.

    Same invitee rules as meeting.create apply to any participants being
    added here: only leads/contacts with a valid email may be invitees,
    deals can never be invitees. Same picklist Option ID / customFieldValues
    internal-name / date-UTC-conversion / never-guess-ownerId rules as
    meeting.create apply to any other field being changed — see
    meeting.create's usage_notes for the full rules; not repeated verbatim
    here to avoid duplicating the same text twice.
  example: {entity_id: 111, participants: [{id: 7236, entity: "user"}]}

- id: meeting.lookup_related
  bucket: meeting
  intent: lookup
  method: GET
  path: "/search/{lead|contact|deal}/lookup, or /companies/lookup?view=meeting, or /search/meeting-invitee/lookup (varies by entity_type — see usage_notes)"
  dynamic_fields: false
  description: "Resolve invitees or related leads/contacts/deals/companies for meeting association or search filters."
  usage_notes: >
    Call this FIRST when the user wants a meeting linked to a specific
    entity or person by name, or wants to add a participant by name.

    entity_type (str): one of "lead", "contact", "deal", "company", or
    "invitee" — each hits a genuinely different real endpoint (GET
    /search/lead/lookup, /search/contact/lookup, /search/deal/lookup,
    /companies/lookup?view=meeting&q=, /search/meeting-invitee/lookup
    respectively), not one shared path — that's a real property of the old
    system, not smoothed into a single fake endpoint here.

    For lead/contact/deal/company: use the returned ID with meeting.search
    on field associatedLeads/associatedContacts/associatedDeals/
    associatedCompanies. For invitee: use the FULL returned object (e.g.
    {"id": 123, "entity": "lead", "name": "...", "emails": [...]}) — as a
    meeting.create/meeting.update participant, or with meeting.search on
    the "participants" field with operator "in". Organizer is usually the
    invitee row with entity="user".

    query (str): lookup search string (e.g. "firstName:John" or
    "comp:Acme"). Leave empty for a default broad listing.

    IMPORTANT for entity_type="invitee": "name:" only matches a SINGLE
    token, never a full "First Last" name — confirmed live: "name:Janardan"
    matches, "name:Janardan Borse" matches nothing at all (Kylas's query
    parser breaks on the space; same root cause as user.lookup's "name:"
    field). If the user gives a full name, search on just the first name
    or last name, not both together, and tell the user which token you
    actually searched.
  example: {entity_type: "invitee", query: "firstName:John"}
