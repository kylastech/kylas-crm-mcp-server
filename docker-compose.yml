services:
  kylas-mcp:
    build: .
    image: kylas-mcp:latest
    container_name: kylas-mcp-server
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Optional: fallback API key for single-user / testing
      # - KYLAS_API_KEY=${KYLAS_API_KEY}
      - KYLAS_BASE_URL=${KYLAS_BASE_URL:-https://api.kylas.io/v1}
      - KYLAS_CLIENT_ID=${KYLAS_CLIENT_ID}
      - KYLAS_CLIENT_SECRET=${KYLAS_CLIENT_SECRET}
      - MCP_SERVER_BASE_URL=${MCP_SERVER_BASE_URL}
    ports:
      # Host port 8000 is often taken locally; override with HOST_PORT=... if needed
      - "${HOST_PORT:-8090}:8000"
    volumes:
      - fastmcp-data:/root/.local/share/fastmcp
    restart: unless-stopped

volumes:
  fastmcp-data:
